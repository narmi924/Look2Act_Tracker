# Look2Act Tracker 系统运行配置
# 工作目录：Look2Act_Tracker_Project/
# 使用方式：由 main.py 或 TrackerPipeline 加载

camera:
  index: 0
  width: 640
  height: 480
  backend: "dshow"  # Windows 推荐使用 DirectShow

face_detection:
  eye_crop_size: 128
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

model:
  checkpoint_path: "checkpoints/best_model.pth"
  use_ipex: true
  use_onnx: false
  onnx_path: "checkpoints/gaze_net.onnx"

geometry:
  # 屏幕物理尺寸（毫米），需根据实际屏幕测量填写
  screen_w_mm: 344.0
  screen_h_mm: 194.0

calibration:
  num_points: 9
  save_path: "calibration.json"
  max_residual_px: 50.0

smoother:
  alpha: 0.3  # EMA 平滑系数，越小越平滑

tracker:
  target_fps: 30
  timer_interval_ms: 33
