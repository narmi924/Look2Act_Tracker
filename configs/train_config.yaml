# Look2Act Tracker 训练配置
# 工作目录：Look2Act_Tracker_Project/
# 使用方式：conda run -n gaze-env python scripts/train.py --config configs/train_config.yaml

model:
  name: "GazeNetV2"
  version: "v2"  # "v1" = 单眼 GazeNet, "v2" = 双眼 + head pose 融合
  channels: [32, 64, 128, 256]
  input_size: 128
  output_dim: 3
  head_pose_dim: 3  # yaw, pitch, roll
  fusion_dim: 128   # 融合层隐藏维度
  dropout: 0.3      # Dropout 概率（缓解过拟合）

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 100
  optimizer: "Adam"
  scheduler: "CosineAnnealingLR"
  weight_decay: 0.0001
  # 设备配置
  device: "xpu"  # 可选: "cpu", "xpu" (Intel Arc GPU)
  use_ipex: true  # 启用 Intel Extension for PyTorch 加速

data:
  dataset_raw_dir: "dataset_raw"
  dataset_processed_dir: "dataset_processed"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  augmentation: true
  num_workers: 4

evaluation:
  metrics:
    - "mean_angle_error"
    - "median_angle_error"
    - "mean_pixel_error"

checkpoint:
  save_dir: "checkpoints"
  save_best_only: true

logging:
  log_dir: "logs"
  log_interval: 1  # 每 N 个 epoch 记录一次
